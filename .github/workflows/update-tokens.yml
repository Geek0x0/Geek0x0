
name: Update Tokens Card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download private tokens card
        env:
          READ_TOKEN: ${{ secrets.TOKENS_CI_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p assets

          if [ -z "${READ_TOKEN}" ]; then
            echo "Missing TOKENS_CI_READ_TOKEN secret"
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            -H "Authorization: Bearer ${READ_TOKEN}" \
            "https://tokens.ci/api/embed/Geek0x0/svg?template=graph&tokens=compact&cost=compact" \
            -o assets/tokens.svg

          if ! grep -q '<svg' assets/tokens.svg; then
            echo "Invalid SVG response"
            exit 1
          fi

          if grep -qiE 'User Not Found|User @.* was not found' assets/tokens.svg; then
            echo "Private profile authentication failed"
            exit 1
          fi

      - name: Remove Rank from SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("assets/tokens.svg")
          svg = path.read_text(encoding="utf-8")

          labels = [
              "Rank · tokens",
              "Unranked",
          ]

          for label in labels:
              pattern = (
                  r'<text\b[^>]*>\s*'
                  + re.escape(label)
                  + r'\s*</text>'
              )

              svg, count = re.subn(
                  pattern,
                  "",
                  svg,
                  flags=re.IGNORECASE
              )

              if count != 1:
                  raise RuntimeError(
                      f"Expected one '{label}' element, "
                      f"found {count}"
                  )

          path.write_text(svg, encoding="utf-8")

          print("Rank removed successfully")
          PY

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/tokens.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update tokens card"
            git push
          else
            echo "No changes to commit"
          fi
